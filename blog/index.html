<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog | Baylık Akademi Spor Kulübü · Yüzme, Taekwondo, Kickboks</title>
<meta name="description" content="Su korkusu, çocuklarda yüzmeye başlama yaşı, doğru teknik, taekwondo ve kickboks üzerine Baylık Akademi hocalarından yazılar.">
<meta name="theme-color" content="#0a2233">
<!-- DEMO blog sayfası (statik). Yayında bu adres sunucu tarafında public/blog/index.php ve yazi.php ile üretilir. -->
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--red:#d71920;--ink:#0d0f13;--ink2:#2a2e35;--muted:#5d626a;--paper:#f6f4f0;--line:#e6e2db;--sea:#0b7489;--sea-hi:#7ce6f1;--night:#0a2233;--wa:#25d366;--wa-ink:#04240f;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--pad:clamp(16px,4vw,48px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{display:block}
:focus-visible{outline:3px solid #ffb300;outline-offset:3px;border-radius:6px}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--pad)}
/* Üst bar */
.top{position:sticky;top:0;z-index:20;background:rgba(10,20,30,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ff6a70;margin-top:-2px}
.top nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.top nav a{font-weight:700;font-size:14px;text-decoration:none;padding:8px 12px;border-radius:999px}
.top nav a.on{background:#fff;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;font-weight:800;text-decoration:none;font-size:15px;border:0;cursor:pointer;font-family:inherit}
.btn svg{width:20px;height:20px}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
@media (max-width:560px){.top nav .hide-s{display:none}.brand small{display:none}}
/* Kahraman alanı */
.hero{background:radial-gradient(90% 120% at 85% -10%,#14a7bd 0%,#0b5d75 35%,var(--night) 75%);color:#fff;padding:56px 0 64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-2px;height:40px;background:var(--paper);clip-path:polygon(0 60%,10% 40%,20% 55%,30% 35%,40% 50%,50% 30%,60% 50%,70% 35%,80% 55%,90% 40%,100% 60%,100% 100%,0 100%)}
.kicker{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sea-hi)}
.hero h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(48px,10vw,120px);line-height:1.02;margin:10px 0 14px}
.hero p{max-width:640px;font-size:clamp(17px,2.2vw,20px);opacity:.92}
/* Kategoriler */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 30px}
.cat{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink2)}
.cat small{font-size:12px;color:var(--muted)}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat.on small{color:rgba(255,255,255,.7)}
/* Kapak görselleri (demo: fotoğraf yerine tasarım) */
.cover{position:relative;overflow:hidden;display:grid;place-items:center;aspect-ratio:16/10}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.feat:hover .cover img,.card:hover .cover img{transform:scale(1.05)}
.cover::before{content:"";position:absolute;inset:0;background:inherit;transition:transform .7s cubic-bezier(.2,.8,.2,1)}

.c-yuzme{background:radial-gradient(120% 90% at 20% 0%,#7ce6f1,#0e8ea6 45%,#0a3d55)}
.c-taekwondo{background:radial-gradient(120% 90% at 80% 0%,#fff,#efe7df 45%,#e3b3b3 120%)}
.c-taekwondo svg{color:var(--red)}
.c-kickboks{background:radial-gradient(120% 90% at 50% 0%,#ff4a53,#7a0c10 55%,#0a0a0c)}
.c-saglik{background:radial-gradient(120% 90% at 30% 0%,#bdf3d4,#2c9f6b 55%,#0d3d2b)}
/* Öne çıkan */
.feat{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(20px,3vw,44px);align-items:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:16px;text-decoration:none;box-shadow:0 30px 60px -40px rgba(0,0,0,.3);margin-bottom:28px}
.feat .cover{border-radius:20px}
.feat:hover .cover::before,.card:hover .cover::before{transform:scale(1.06)}
.feat h2{font-size:clamp(26px,3vw,40px);line-height:1.15;color:var(--ink);margin:10px 0 12px;font-weight:800;letter-spacing:-.01em}
.feat p{font-size:17px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sea)}
.tag.new::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.meta{display:block;margin-top:14px;font-size:14px;color:var(--muted);font-weight:600}
@media (max-width:820px){.feat{grid-template-columns:1fr;padding:12px}.feat>div{padding:4px 8px 10px}}
/* Kart ızgarası */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px;margin-bottom:60px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px rgba(0,0,0,.35)}
.card .b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:20px;line-height:1.3;color:var(--ink);font-weight:800}
.card p{font-size:15px;color:var(--muted)}
.card .meta{margin-top:auto;padding-top:6px}
.empty{padding:60px 0;color:var(--muted)}
/* Yazı */
.art{max-width:780px;margin:0 auto;padding:40px var(--pad) 40px}
.back{display:inline-flex;font-weight:800;font-size:14px;text-decoration:none;color:var(--sea)}
.art h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(36px,6vw,64px);line-height:1.08;color:var(--ink);margin:14px 0 14px}
.lead{font-size:20px;color:var(--muted);line-height:1.55}
.byline{display:flex;align-items:center;gap:12px;margin:22px 0 26px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.byline b{display:block;color:var(--ink)}
.byline span{font-size:14px;color:var(--muted)}
.art .cover{border-radius:24px;margin-bottom:30px}
.prose{font-size:18.5px;line-height:1.75;color:#262a30}
.prose h2{font-size:clamp(22px,3vw,28px);line-height:1.25;color:var(--ink);margin:34px 0 10px;font-weight:800}
.prose p{margin:0 0 16px}
.prose ul{margin:0 0 18px 22px}
.prose li{margin:6px 0}
.prose blockquote{margin:26px 0;padding:18px 22px;border-left:5px solid var(--red);background:#fff;border-radius:0 16px 16px 0;font-weight:700;font-size:20px;color:var(--ink)}
.cta{max-width:780px;margin:10px auto 50px;padding:0 var(--pad)}
.cta>div{background:linear-gradient(135deg,var(--night),#0b5d75);color:#fff;border-radius:26px;padding:28px}
.cta h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,4vw,40px);line-height:1.1}
.cta p{opacity:.9;margin:8px 0 18px}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}
.related{max-width:1360px;margin:0 auto;padding:0 var(--pad)}
.related h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:32px;color:var(--ink);margin-bottom:18px}
.share{display:flex;gap:8px;margin:30px 0 0;flex-wrap:wrap}
footer{background:#0a0a0c;color:rgba(255,255,255,.75);padding:30px 0 calc(30px + env(safe-area-inset-bottom));font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
footer a{color:#fff}
.note{font-size:12.5px;opacity:.6}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#d71920"/><circle cx="60" cy="60" r="50" fill="#0d0f13"/><path d="M14 80c8-5 15-5 23 0s15 5 23 0 15-5 23 0 15 5 23 0v6c-8 5-15 5-23 0s-15-5-23 0-15 5-23 0-15-5-23 0z" fill="#14b8cc"/><path d="M20 92c7-4 13-4 20 0s13 4 20 0 13-4 20 0 13 4 20 0" fill="none" stroke="#7ce6f1" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M63 40 55 60M62 44 46 49M62 44l15 8M55 60l-4 13M55 60l18-6 20-15"/></g><circle cx="68" cy="29" r="7" fill="#fff"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.66 15l-1.3 4.8 4.92-1.29A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-2.92.77.78-2.85-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.13-.55.12-.17.25-.64.8-.78.96-.14.17-.29.19-.54.06a6.7 6.7 0 0 1-3.32-2.9c-.25-.43.25-.4.72-1.34.08-.16.04-.3-.02-.43-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3 2.74 2.74 0 0 0-.86 2.04c0 1.2.88 2.37 1 2.53.12.17 1.73 2.64 4.2 3.7 1.55.67 2.16.73 2.94.61.47-.07 1.46-.6 1.66-1.17.21-.58.21-1.07.15-1.17-.06-.11-.22-.17-.47-.3z"/></symbol>
  <symbol id="c-yuzme" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="7" r="2"/><path d="M4 13l5-4 3 2.5L15 10M2 17c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0 1.5.5 2 .5"/></g></symbol>
  <symbol id="c-taekwondo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="4.5" r="2"/><path d="M13 8l-2.5 5.5M12.5 9.5 8 11M12.5 9.5l3.5 2M10.5 13.5 9.5 18l.8 3.5M10.5 13.5l5-1.5 5-4"/></g></symbol>
  <symbol id="c-kickboks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14V8a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H9"/><path d="M7 11H5.5A1.5 1.5 0 0 0 4 12.5v1A3.5 3.5 0 0 0 7.5 17H8v3h8v-4"/><path d="M11 8h4"/></g></symbol>

</svg>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../"><svg width="40" height="40" aria-hidden="true"><use href="#i-logo"/></svg><span><b>Baylık Akademi</b><small>Spor Kulübü</small></span></a>
    <nav aria-label="Site">
      <a href="../" class="hide-s">Ana sayfa</a>
      <a href="./" class="on">Blog</a>
      <a class="btn btn-wa" href="../#randevu" style="min-height:40px;padding:8px 14px"><svg aria-hidden="true"><use href="#i-wa"/></svg>Randevu</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>© 2026 <a href="../">Baylık Akademi Spor Kulübü</a> · Sincan &amp; Eryaman, Ankara</span>
    <span><a href="tel:+905428980601">0542 898 06 01</a> · <a href="https://www.instagram.com/baylikakademisporkulubu/" target="_blank" rel="noopener">Instagram</a></span>
    <span class="note">Demo sürüm · Yazılar örnek olarak hazırlanmıştır · Fotoğraflar: Unsplash</span>
  </div>
</footer>

<script type="module">
import { YAZILAR, KATEGORILER, kapakUrl } from '../demo/yazilar.js';

const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const katKod = k => k.toLowerCase().replace('ü', 'u').replace('ğ', 'g').replace('ı', 'i').replace('ş', 's');
const kapak = (y, buyuk) => `<span class="cover c-${katKod(y.kategori)}"><img src="${kapakUrl(y)}" alt="" loading="${buyuk ? 'eager' : 'lazy'}" onerror="this.remove()"></span>`;
const meta = y => `${esc(y.tarih)} · ${y.dakika} dk okuma`;
const link = y => `?yazi=${encodeURIComponent(y.slug)}`;
const WA = 'https://wa.me/905428980601?text=';

function liste(kategori) {
  const secili = kategori ? YAZILAR.filter(y => y.kategori === kategori) : YAZILAR;
  const [one, ...diger] = kategori ? [null, ...secili] : secili;
  document.title = (kategori ? kategori + ' yazıları' : 'Blog') + ' | Baylık Akademi';
  app.innerHTML = `
    <section class="hero"><div class="wrap">
      <p class="kicker">Blog</p>
      <h1>${kategori ? esc(kategori) : 'Sudan ve minderden notlar'}</h1>
      <p>Yüzme tekniği, su korkusu, çocuk gelişimi, taekwondo ve kickboks üzerine hocalarımızdan yazılar.</p>
    </div></section>
    <div class="wrap">
      <nav class="cats" aria-label="Kategoriler">
        <button class="cat${!kategori ? ' on' : ''}" data-k="">Tümü <small>${YAZILAR.length}</small></button>
        ${KATEGORILER.map(k => `<button class="cat${k === kategori ? ' on' : ''}" data-k="${esc(k)}">${esc(k)} <small>${YAZILAR.filter(y => y.kategori === k).length}</small></button>`).join('')}
      </nav>
      ${one ? `<a class="feat" href="${link(one)}">${kapak(one, true)}<div><span class="tag new">En yeni yazı · ${esc(one.kategori)}</span><h2>${esc(one.baslik)}</h2><p>${esc(one.ozet)}</p><span class="meta">${meta(one)}</span></div></a>` : ''}
      ${diger.length ? `<div class="grid">${diger.map(y => `<a class="card" href="${link(y)}">${kapak(y)}<span class="b"><span class="tag">${esc(y.kategori)}</span><h3>${esc(y.baslik)}</h3><p>${esc(y.ozet)}</p><span class="meta">${meta(y)}</span></span></a>`).join('')}</div>` : '<p class="empty">Bu kategoride henüz yazı yok.</p>'}
    </div>`;
  app.querySelectorAll('.cat').forEach(b => b.onclick = () => git(b.dataset.k ? `?kategori=${encodeURIComponent(b.dataset.k)}` : './'));
}

function yazi(slug) {
  const y = YAZILAR.find(x => x.slug === slug);
  if (!y) return liste('');
  document.title = y.baslik + ' | Baylık Akademi';
  const ilgili = YAZILAR.filter(x => x !== y && x.kategori === y.kategori).concat(YAZILAR.filter(x => x !== y && x.kategori !== y.kategori)).slice(0, 3);
  const brans = y.kategori === 'Sağlık' ? 'Yüzme' : y.kategori;
  app.innerHTML = `
    <article class="art">
      <a class="back" href="./">← Tüm yazılar</a>
      <h1>${esc(y.baslik)}</h1>
      <p class="lead">${esc(y.ozet)}</p>
      <div class="byline"><svg width="44" height="44" aria-hidden="true"><use href="#i-logo"/></svg><div><b>Baylık Akademi</b><span>${esc(y.kategori)} · ${meta(y)}</span></div></div>
      ${kapak(y, true)}
      <div class="prose">${y.govde}</div>
      <div class="share">
        <a class="btn btn-ghost" href="${WA}${encodeURIComponent(y.baslik + ' ' + location.href)}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg>WhatsApp'ta paylaş</a>
      </div>
    </article>
    <aside class="cta"><div>
      <h2>Önce tanışalım</h2>
      <p>${esc(brans)} için ön görüşme randevusu alın; havuzu ya da salonu görün, hocanızla tanışın.</p>
      <div class="row">
        <a class="btn btn-wa" href="../#randevu"><svg aria-hidden="true"><use href="#i-wa"/></svg>Ön görüşme randevusu</a>
        <a class="btn btn-ghost" href="${WA}${encodeURIComponent('Merhaba, ' + brans.toLowerCase() + ' dersleri hakkında bilgi almak istiyorum.')}" target="_blank" rel="noopener">Soru sor</a>
      </div>
    </div></aside>
    <section class="related" aria-labelledby="ilgili"><h2 id="ilgili">Bunları da okuyun</h2>
      <div class="grid">${ilgili.map(x => `<a class="card" href="${link(x)}">${kapak(x)}<span class="b"><span class="tag">${esc(x.kategori)}</span><h3>${esc(x.baslik)}</h3><p>${esc(x.ozet)}</p><span class="meta">${meta(x)}</span></span></a>`).join('')}</div>
    </section>`;
}

function ciz() {
  const q = new URLSearchParams(location.search);
  if (q.get('yazi')) yazi(q.get('yazi')); else liste(q.get('kategori') || '');
  window.scrollTo(0, 0);
}
function git(url) { history.pushState(null, '', url); ciz(); }
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="?"], a[href="./"]');
  if (a && !e.metaKey && !e.ctrlKey) { e.preventDefault(); git(a.getAttribute('href')); }
});
addEventListener('popstate', ciz);
ciz();
</script>
