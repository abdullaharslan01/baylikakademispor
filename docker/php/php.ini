expose_php = Off
date.timezone = Europe/Istanbul
memory_limit = 256M
; Panelden video yükleme en fazla 60 MB (görseller 12 MB, api/blog.php denetler)
upload_max_filesize = 62M
post_max_size = 64M
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.save_path = /srv/data/sessions
; Hatalar ziyaretçiye gösterilmez, konteyner günlüğüne yazılır (docker compose logs php)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; Panel oturumu en fazla 4 saat boşta kalabilir (ayrıntı: api/blog.php)
session.gc_maxlifetime = 14400
