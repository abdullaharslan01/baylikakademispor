# Demo siteyi GitHub Pages'te yayınlar: kökteki sayfalar + public/ içeriği (fontlar, görseller, modeller).
# PHP paneli (public/api, public/_inc ...) Pages'e gönderilmez; o kısım sunucu kurulunca kullanılır.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r blog demo _site/
          cp -r public/fonts public/img public/models _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
